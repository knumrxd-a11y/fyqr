<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Imagine City</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@400;500&display=swap">
<style>
/* layout idea: a night city skyline stays on top and regains color as you answer; the story panel scrolls beneath it */
:root{
  --bg:#101014; --bg2:#1b1b21; --line:#34343d; --ink:#F4F3EF; --mute:#A9A9B3;
  --dga:#F25AA6; --dgd:#9A7BFF; --afx:#F59A3B; --igd:#3BCB7E; --den:#4BA3F5;
  --display:'Mitr','IBM Plex Sans Thai',sans-serif; --body:'IBM Plex Sans Thai','Noto Sans Thai',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
#app{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.stage{position:relative;height:clamp(150px,26vh,230px);border-bottom:1px solid var(--line)}
canvas{display:block;width:100%;height:100%}
.meter{display:flex;gap:3px;padding:12px 18px 0}
.meter i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.meter i.on{background:var(--ink)}
.meter i.now{background:var(--mute)}
#screen{padding:18px 18px 28px;display:flex;flex-direction:column;gap:14px;animation:in .35s ease-out}
@keyframes in{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#screen{animation:none}}
.tag{font-size:13px;color:var(--mute);letter-spacing:.02em}
h1,h2{font-family:var(--display);font-weight:500;margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:40px}
h2{font-size:25px}
p{margin:0}
.lead{color:var(--mute)}
.intro{color:var(--mute);font-size:15px}
.q{font-size:17px}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:4px}
button{font:inherit;color:inherit}
.opt{min-height:54px;text-align:left;padding:12px 14px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);cursor:pointer;line-height:1.45;transition:border-color .15s,background .15s}
.opt:hover{border-color:#6a6a77}
.opt:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,.chk:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.opt.picked{border-color:var(--ink);background:#26262e}
.opt:disabled{cursor:default;opacity:.55}
.opt.picked:disabled{opacity:1}
.btn{align-self:flex-start;min-height:48px;padding:10px 22px;border-radius:999px;border:0;background:var(--ink);color:#101014;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
ul.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.field .lab{font-size:14px;color:var(--mute)}
input[type=text],select{min-height:46px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);padding:8px 12px;font:inherit}
.chks{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;gap:6px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg2);font-size:14px;cursor:pointer}
.chk input{accent-color:#F4F3EF}
.note{font-size:13px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:13.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.chip.first{color:var(--ink);border-color:currentColor}
.res-title{font-size:32px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.bar span{display:block;height:100%}
.block{display:flex;flex-direction:column;gap:9px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg2)}
.block h3{margin:0;font-family:var(--display);font-weight:500;font-size:19px}
.dev{font-size:13px;color:var(--mute);padding:10px 12px;border:1px dashed var(--line);border-radius:8px}
.foot{margin-top:auto;padding:0 18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--mute)}
.foot label{display:flex;gap:6px;align-items:center;cursor:pointer}
.foot button{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;min-height:36px}

/* ---- journey mode: full-screen moving city, floating cards, travel transitions ---- */
.stage{position:fixed;inset:0;height:auto;border:0;z-index:-1}
#app{position:relative;z-index:0;padding-top:clamp(180px,34vh,320px)}
.meter{position:fixed;top:0;left:0;right:0;max-width:460px;margin:auto;z-index:3;pointer-events:none}
#screen{position:relative;z-index:2;margin:0 12px;border:1px solid rgba(255,255,255,.09);border-radius:18px;background:rgba(14,14,18,.66);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);animation-duration:.8s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(34px) scale(.94);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
#screen.leave{animation:leave .7s cubic-bezier(.5,0,1,.6) forwards}
@keyframes leave{to{opacity:0;transform:scale(1.3) translateY(-40px);filter:blur(8px)}}
.foot{position:relative;z-index:2;text-shadow:0 1px 6px #000}
.opt{background:rgba(27,27,33,.82);animation:cardIn .7s cubic-bezier(.2,.9,.3,1.2) both,bob 5s ease-in-out infinite;animation-delay:calc(var(--i)*110ms + .3s),calc(var(--i)*450ms + 1.2s)}
.opt:nth-child(odd){--r:-2deg}.opt:nth-child(even){--r:2deg}
@keyframes cardIn{from{opacity:0;transform:translateY(46px) rotate(var(--r,0deg)) scale(.9)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-3px)}}
.opt.picked:disabled{animation:pickd .5s cubic-bezier(.2,.9,.3,1.3) forwards;border-color:#fff6dc;box-shadow:0 0 32px rgba(255,236,190,.3)}
.opt:disabled:not(.picked){animation:dim .5s ease forwards}
@keyframes pickd{to{transform:scale(1.04);opacity:1}}
@keyframes dim{to{opacity:.25;filter:grayscale(1) blur(1.5px);transform:scale(.96)}}
#snd{position:fixed;top:12px;right:12px;z-index:5;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(14,14,18,.7);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center}
#snd.off{opacity:.55;text-decoration:line-through}
#snd:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#app{min-height:100vh;min-height:100dvh;padding-top:clamp(150px,29vh,300px);padding-top:clamp(150px,29dvh,300px)}
.meter{padding-top:calc(12px + env(safe-area-inset-top,0px))}
#snd{top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px))}
.foot{padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.opt,.btn,#snd{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
h1{font-size:clamp(34px,10.5vw,44px)}
@media(max-width:480px){#screen{margin:0 10px;padding:16px 16px 22px;background:rgba(14,14,18,.58)}.opt{padding:13px 14px}}
#plc{position:fixed;top:calc(54px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;z-index:4;pointer-events:none;font-family:var(--display);font-size:clamp(20px,6vw,28px);letter-spacing:.04em;opacity:0;text-shadow:0 2px 16px rgba(0,0,0,.8)}
#plc small{display:block;font-family:var(--body);font-size:12px;letter-spacing:.14em;color:var(--mute);margin-bottom:2px}
#plc.show{animation:plc 2.8s ease both}
@keyframes plc{0%{opacity:0;transform:translateY(-8px) scale(.96);filter:blur(4px)}18%,75%{opacity:1;transform:none;filter:none}100%{opacity:0}}
#plc{display:none}
.meter{padding:calc(26px + env(safe-area-inset-top,0px)) 62px 14px 18px;background:linear-gradient(rgba(10,10,14,.9),rgba(10,10,14,0))}
#snd{width:36px;height:36px;font-size:17px;top:calc(10px + env(safe-area-inset-top,0px))}
.block{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.1)}
.chip{background:rgba(255,255,255,.03)}
@media (prefers-reduced-motion:reduce){.opt,#screen.leave{animation:none!important}.opt:disabled:not(.picked){opacity:.3}}
#sc{position:absolute;inset:0;pointer-events:none;opacity:.9}

:root{--bg:#0a0818;--bg2:#171235;--line:#392f66;--mute:#b4aed2}
html,body{background:#0a0818}
#screen{background:rgba(16,12,38,.64);border-color:rgba(190,170,255,.2);box-shadow:0 18px 60px rgba(6,3,20,.55)}
.opt{background:rgba(26,20,58,.82)}.opt.picked{background:#2c2260}.opt:hover{border-color:#8a7cd0}
.meter{background:linear-gradient(rgba(8,6,22,.9),rgba(8,6,22,0))}
body.gal h1{color:#fff1c4;text-shadow:0 0 28px rgba(255,226,150,.42)}
body.gal #screen{background:rgba(14,10,34,.5)}
body.gal .foot,body.gal .foot button{color:#c9c2ea}
</style>
<style id="introfocus">
/* ฉากแรก: ให้ฉากเด่น การ์ดข้อความเล็กลง โปร่งขึ้น และเลื่อนลงไปอยู่ด้านล่าง */
body.gal #app{padding-top:clamp(52vh,calc(100vh - 330px),74vh)}
body.gal #screen{padding:14px 18px 16px;gap:8px;background:rgba(14,10,34,.34);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border-color:rgba(255,255,255,.1)}
body.gal #screen h1{font-size:30px}
body.gal #screen h2{font-size:16px!important}
body.gal #screen p{font-size:14px;line-height:1.5}
body.gal #screen .note{display:none}
body.gal #screen .btn{min-height:44px;padding:8px 22px}
body.gal .foot{padding-bottom:14px}
</style>
<style id="qafocus">
/* หน้าตอบคำถาม: ให้ฉากเด่น การ์ดกะทัดรัดและโปร่ง ตอนเลือกคำตอบการ์ดจางลงให้เห็นฉากเคลื่อนไหว */
body.qa #app{padding-top:clamp(290px,41vh,430px);padding-top:clamp(290px,41dvh,430px)}
body.qa #sc{opacity:1}
body.qa #screen{padding:12px 14px 16px;gap:6px;background:rgba(14,10,34,.42);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);transition:opacity .45s ease,background .3s}
body.qa #screen h2{font-size:16px!important;line-height:1.4}
body.qa #screen p{font-size:14px;line-height:1.5}
body.qa .opts{gap:7px}
body.qa .opt{min-height:44px;padding:9px 12px;font-size:14px;line-height:1.4;background:rgba(24,18,54,.72)}
body.qa #screen:has(.opt.picked:disabled){opacity:.22;pointer-events:none}
.backbtn{position:static!important;align-self:flex-end;display:inline-flex;align-items:center;min-height:32px;padding:4px 12px;margin:-2px 0 4px auto;font-size:12.5px}
</style>
<script>
addEventListener('DOMContentLoaded',function(){const b=document.body;let last='';
function sync(){const q=b.classList.contains('qa');const k=q+'';if(k!==last){last=k;setTimeout(()=>dispatchEvent(new Event('resize')),60)}}
new MutationObserver(sync).observe(b,{attributes:true,attributeFilter:['class']});});
</script>
</head>

function isl(c,col,x,y,w,sd,lit){

  c.fillStyle=col('#06222a');c.beginPath();c.moveTo(x-w/2,y);c.lineTo(x+w/2,y);c.lineTo(x+w*.18,y+h*.55);c.lineTo(x+w*.02,y+h);c.lineTo(x-w*.2,y+h*.5);c.closePath();c.fill();
  const n=Math.max(3,Math.floor(w/9));
  for(let i=0;i<n;i++){const bx=x-w/2+(i+.5)*w/n+(rr()-.5)*3,bw=w/n*.7,bh=w*(.09+rr()*.26)*(i%3===1?1.5:1);
    c.fillStyle=col('#0a2f38');c.fillRect(bx-bw/2,y-bh,bw,bh);
    if(rr()<.5){c.beginPath();c.moveTo(bx-bw/2,y-bh);c.lineTo(bx,y-bh-bw*1.4);c.lineTo(bx+bw/2,y-bh);c.fill()}

  else if(a==='pick'){
    if(S.lock)return;S.lock=true;
    const o=SC[S.si].o[S.perm[i]];S.picks[S.si]=o[0];S.w[o[0]]++;burst(o[0]);doAct(o[0]);
    mark(i);
    travelThen(()=>{S.lock=false;
      if(S.si===5){S.alley=calcAlleys();S.ai=0;S.stage='alley';newPerm(4)}
      else if(S.si===10){S.stage='pass'}
      else{S.si++;newPerm(5)}
      render()},1500);
  }
  else if(a==='alleypick'){
    if(S.lock)return;S.lock=true;
    const m=S.alley[S.ai],o=AL[m].o[S.perm[i]];S.alleyPick[m]=o[1];burst(m);doAct(m);mark(i);
    travelThen(()=>{S.lock=false;
      if(S.ai+1<S.alley.length){S.ai++;newPerm(4)}else{S.stage='scene';S.si=6;newPerm(5)}
      render()},1500);
  }
  else if(a==='finish'){if(S.lock)return;
    PASS.forEach(f=>{
      if(f.k==='multi'){S.pass[f.id]=[...$s.querySelectorAll('input[data-m="'+f.id+'"]:checked')].map(x=>x.value)}
      else{const el=$s.querySelector('[data-f="'+f.id+'"]');if(el)S.pass[f.id]=el.value}
    });
    S.lock=true;travelThen(()=>{S.result=calcResult();S.stage='result';S.lock=false;burst(S.result.m[0]);sfx('finale');render()});
  }
  else if(a==='again'){S=fresh();document.getElementById('devbox').checked=false;render()}
  else if(a==='subscribe'){msg('ตัวอย่างสำหรับทดลองเล่น: ตอนส่งงานจริงปุ่มนี้จะเชื่อมกับช่องทางสมัครของคณะ')}
  else if(a==='copy'){
    const r=S.result;const title=r.kind==='single'?MJ[r.m[0]].single:MIX[r.m.join('+')];
    const txt='ฉันคือ “'+title+'” จาก Imagine City: คืนสุดท้ายก่อนสีจะหายไป';
    (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>msg('คัดลอกแล้ว: '+txt),()=>msg('คัดลอกไม่ได้ในหน้านี้ ข้อความคือ: '+txt));
  }
}

function msg(t){const m=document.getElementById('msg');if(m)m.textContent=t}

  const c=e.target;if(c.dataset&&c.dataset.m){const max=+c.dataset.max;const on=$s.querySelectorAll('input[data-m="'+c.dataset.m+'"]:checked');if(on.length>max){c.checked=false}}
});

const st=document.createElement('style');st.textContent=`
.rwin{position:absolute;left:5.3%;top:4%;width:89.4%;height:71%;border-radius:4%/3%;overflow:hidden;background:radial-gradient(ellipse at 50% 62%,var(--mc) 0%,var(--md) 78%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.rwin .rays{position:absolute;left:50%;top:62%;width:190%;aspect-ratio:1;margin:-95% 0 0 -95%;background:repeating-conic-gradient(rgba(255,255,255,.22) 0 7deg,transparent 7deg 20deg);-webkit-mask:radial-gradient(circle,#000 8%,transparent 62%);mask:radial-gradient(circle,#000 8%,transparent 62%);animation:rspin 40s linear infinite}
@keyframes rspin{to{transform:rotate(360deg)}}
.rwin .stars{position:absolute;inset:0}
.rwin .stars b{position:absolute;width:var(--s);height:var(--s);background:#fff6dc;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:rtw 2.4s ease-in-out infinite;animation-delay:var(--d);opacity:0}
@keyframes rtw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(60deg)}}
.rchars{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-end;transform:translateX(var(--px,0px)) rotate(var(--lean,0deg));transform-origin:50% 100%}
.rchars img.act{animation:var(--an) .8s cubic-bezier(.3,1.4,.5,1) both,rfloat 3.2s ease-in-out .8s infinite}
@keyframes a-jump{0%{transform:scale(1,1)}25%{transform:scale(1.12,.84)}55%{transform:translateY(-26px) scale(.94,1.12) rotate(5deg)}100%{transform:none}}
@keyframes a-spin{0%{transform:perspective(500px) rotateY(0)}100%{transform:perspective(500px) rotateY(720deg)}}
@keyframes a-flip{0%{transform:translateY(0) rotate(0)}40%{transform:translateY(-38px) rotate(-200deg)}100%{transform:translateY(0) rotate(-360deg)}}
@keyframes a-wiggle{0%,100%{transform:rotate(0)}15%{transform:rotate(-9deg) scaleX(1.05)}35%{transform:rotate(8deg) scaleX(.96)}55%{transform:rotate(-6deg)}75%{transform:rotate(4deg)}}
@keyframes a-boing{0%{transform:scale(1)}20%{transform:scale(1.3,.72)}45%{transform:scale(.8,1.25)}70%{transform:scale(1.1,.92)}100%{transform:scale(1)}}
@keyframes a-swing{0%{transform:rotate(0)}20%{transform:rotate(-16deg)}45%{transform:rotate(13deg)}70%{transform:rotate(-7deg)}100%{transform:rotate(0)}}
@keyframes a-zoom{0%{transform:scale(1)}35%{transform:scale(1.28) rotate(-4deg)}100%{transform:scale(1)}}
.rbub{position:absolute;left:50%;top:7%;transform:translate(-50%,0) scale(.5);padding:6px 12px;border-radius:14px;background:#fffaf0;color:#2a2038;font-size:13px;font-weight:600;line-height:1.3;white-space:nowrap;pointer-events:none;opacity:0;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:3}
.rbub:after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;margin-left:-5px;background:#fffaf0;transform:rotate(45deg)}
.rbub.show{animation:rbub 1.5s ease both}
@keyframes rbub{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}15%{opacity:1;transform:translate(-50%,0) scale(1.06)}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px) scale(.96)}}
.rhint{position:absolute;left:0;right:0;bottom:3%;text-align:center;font-size:12px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6);pointer-events:none;animation:rhint 2.2s ease-in-out 2.4s infinite;opacity:0}
@keyframes rhint{0%,100%{opacity:0}50%{opacity:.95}}
.rwin.hype .rays{animation-duration:3s}
.rchars img{display:block;height:92%;width:auto;max-width:96%;object-fit:contain;transform-origin:50% 100%;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45));animation:rpop .8s cubic-bezier(.2,1.4,.4,1) 1.3s both,rfloat 3.2s ease-in-out 2.1s infinite;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rchars.two img{height:74%;max-width:56%;margin:0 -7%}
.rchars.two img:nth-child(2){animation-delay:1.5s,2.4s;margin-bottom:5%}
.rchars img.jump{animation:rjump .6s cubic-bezier(.3,1.6,.5,1) both,rfloat 3.2s ease-in-out .6s infinite}
@keyframes rpop{0%{opacity:0;transform:translateY(40px) scale(.4) rotate(-8deg)}100%{opacity:1;transform:none}}
@keyframes rfloat{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-7px) rotate(1.2deg)}}
@keyframes rjump{0%{transform:scale(1,1)}25%{transform:scale(1.12,.86)}55%{transform:translateY(-22px) scale(.94,1.1) rotate(5deg)}100%{transform:none}}
.rpuff{position:absolute;width:10px;height:10px;pointer-events:none;background:var(--pc);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:rpf .9s ease-out forwards}
@keyframes rpf{to{transform:translate(var(--dx),var(--dy)) rotate(240deg) scale(.2);opacity:0}}
.pmas{position:relative;display:flex;align-items:center;gap:12px;margin:8px 0 0;padding:8px 12px 8px 8px;border-radius:14px;background:linear-gradient(100deg,color-mix(in srgb,var(--mc) 26%,transparent),rgba(255,255,255,.04));border:1px solid color-mix(in srgb,var(--mc) 55%,transparent);overflow:hidden;opacity:0;transform:translateX(-18px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,1.2,.4,1)}
.pmas.in{opacity:1;transform:none}
.pmas img{flex:none;height:92px;width:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));cursor:pointer;animation:rfloat 3.4s ease-in-out infinite;transform-origin:50% 100%;-webkit-tap-highlight-color:transparent}
.pmas img.jump{animation:rjump .6s cubic-bezier(.3,1.6,.5,1) both,rfloat 3.4s ease-in-out .6s infinite}
.pmas span{font-size:14px;line-height:1.5}
.pmas b{display:block;font-size:12px;letter-spacing:.06em;color:var(--mc);text-transform:uppercase}
.pmas:before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.14) 50%,transparent 60%);transform:translateX(-120%);animation:rsw 4.5s ease-in-out 1.5s infinite}
@keyframes rsw{60%,100%{transform:translateX(120%)}}
.rank{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 8px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);opacity:0;transform:translateX(-14px);transition:opacity .5s ease calc(var(--i)*.12s),transform .5s cubic-bezier(.2,1.2,.4,1) calc(var(--i)*.12s)}
.rrow.top{background:color-mix(in srgb,var(--mc) 22%,transparent);border-color:var(--mc);box-shadow:0 0 18px color-mix(in srgb,var(--mc) 40%,transparent)}
.rank.in .rrow{opacity:1;transform:none}
.rrow:not(.top) img{filter:grayscale(.55) brightness(.85)}
.rrow .rno{flex:none;width:20px;text-align:center;font-weight:700;color:var(--mc)}
.rrow img{flex:none;height:46px;width:auto}
.rrow.top img{height:58px;animation:rfloat 3s ease-in-out infinite}

const dk=(h,t)=>{const c=hx(h);return '#'+c.map(v=>Math.round(v*(1-t)+18*t).toString(16).padStart(2,'0')).join('')};
function puff(host,x,y,col){for(let i=0;i<9;i++){const e=document.createElement('i');e.className='rpuff';const a=i/9*6.283+Math.random()*.5,r=34+Math.random()*34;e.style.cssText='left:'+x+'px;top:'+y+'px;--pc:'+col+';--dx:'+Math.cos(a)*r+'px;--dy:'+Math.sin(a)*r+'px';host.appendChild(e);setTimeout(()=>e.remove(),950)}}
const LINES={DGD:['ลองจัดใหม่ดูสิ!','เส้นนี้ต้องเป๊ะ','ไอเดียมาแล้ว!','ขอปรับอีกนิดนะ'],DGA:['สีสดๆ ต้องมา!','วาดต่ออีกนิด','ศิลป์คือชีวิต!','เลอะสีแล้วนะ'],AFX:['ไฟ กล้อง แอ็กชัน!','คัตตัดนี้เจ๋ง','ฉากนี้ต้องว้าว','เก็บอีกเทค!'],IGD:['เลเวลอัป!','ขอเล่นอีกรอบ','ด่านนี้ง่ายมาก','เกมเริ่ม!'],DEN:['ขึ้นเวทีกัน!','เสียงดังๆ เลย','โชว์ต้องดำเนินต่อ','ปรบมือหน่อย!']};
const ACTS=['a-jump','a-spin','a-wiggle','a-flip','a-boing','a-swing','a-zoom'];
function bindAct(img,host,col,k){let n=0,combo=0,ct=0,bt=0;const bub=host.querySelector('.rbub'),hint=host.querySelector('.rhint');
  img.addEventListener('click',e=>{
    const now=performance.now();combo=now-ct<1100?combo+1:1;ct=now;
    const an=ACTS[(n++ +Math.floor(Math.random()*3))%ACTS.length];
    img.classList.remove('act');img.style.setProperty('--an',an);void img.offsetWidth;img.classList.add('act');
    const r=host.getBoundingClientRect();puff(host,e.clientX-r.left,e.clientY-r.top,col);
    if(hint)hint.remove();
    if(bub){const L=LINES[k]||LINES.DGD;bub.textContent=combo>=5?'สุดยอดไปเลย!':L[Math.floor(Math.random()*L.length)];bub.classList.remove('show');void bub.offsetWidth;bub.classList.add('show')}
    if(combo>=5){combo=0;host.classList.add('hype');setTimeout(()=>host.classList.remove('hype'),2200);for(let i=0;i<7;i++)setTimeout(()=>puff(host,r.width*(.15+Math.random()*.7),r.height*(.25+Math.random()*.55),i%2?'#fff6dc':col),i*90)}
    try{sfx('pick')}catch(_){}try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}});
}
function bindJump(img,host,col){img.addEventListener('click',e=>{img.classList.remove('jump');void img.offsetWidth;img.classList.add('jump');const r=host.getBoundingClientRect();puff(host,e.clientX-r.left,e.clientY-r.top,col);try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}});}
const _rh=window.resultHTML;
window.resultHTML=function(){let h=_rh.apply(this,arguments);const rk=rank(10),ms=S.result.m.slice().sort((x,y)=>rk.indexOf(x)-rk.indexOf(y));
  const col=MJ[ms[0]].c;
  const stars=Array.from({length:12},(_,i)=>'<b style="left:'+(6+hash(i,3,1)*88).toFixed(0)+'%;top:'+(6+hash(i,5,2)*70).toFixed(0)+'%;--s:'+(7+hash(i,1,7)*10).toFixed(0)+'px;--d:'+(hash(i,2,3)*2.4).toFixed(2)+'s"></b>').join('');
  const win='<div class="rwin" style="--mc:'+col+';--md:'+dk(col,.72)+'"><div class="rays"></div><div class="stars">'+stars+'</div><div class="rchars">'+[ms[0]].map(m=>'<img src="'+MAS[m]+'" alt="ตัวแทนสาขา '+MJ[m].prog+'" draggable="false">').join('')+'</div><div class="rbub" aria-hidden="true"></div><div class="rhint">แตะเจ้าตัวเล็กดูสิ</div></div>';
  h=h.replace('<div class="rplate">',win+'<div class="rplate">');
  h=h.replace(/<p>เรียนได้ที่ สาขา <b>([^<]+)<\/b><\/p>/g,(m0,pg)=>{const k=PK[pg];if(!k)return m0;const c=MJ[k].c;
    return '<div class="pmas" style="--mc:'+c+'"><span><b>'+k+'</b>เรียนได้ที่ สาขา <b style="display:inline;font-size:inherit;letter-spacing:0;text-transform:none;color:'+c+'">'+pg+'</b></span></div>'});
  const t=scores(10),top=Math.max(1,...Object.values(t));
  const rows=rk.map((k,i)=>'<div class="rrow'+(i===0?' top':'')+'" style="--mc:'+MJ[k].c+';--i:'+i+'"><span class="rno">'+(i+1)+'</span><div class="rin"><div class="rnm"><b>'+k+'</b> <small>'+MJ[k].prog+'</small></div><div class="rbar"><i style="--w:'+(t[k]/top*100).toFixed(0)+'%"></i></div></div><span class="rsc">'+t[k]+'<small>/11</small></span></div>').join('');
  h=h.replace('<div class="block"><h3>ไม่ว่าจะเป็น','<div class="block"><h3>คะแนนแต่ละสาขา เรียงจากมากไปน้อย</h3><div class="rank">'+rows+'</div></div><div class="block"><h3>ไม่ว่าจะเป็น');
  return h};
const _r=window.render;window.render=function(){_r.apply(this,arguments);if(S.stage!=='result')return;
  setTimeout(()=>{const card=document.getElementById('rcard');if(!card)return;const w=card.querySelector('.rwin');if(!w||w.dataset.on)return;w.dataset.on=1;
    const ch=card.querySelector('.rchars'),col=MJ[S.result.m[0]].c;
    ch.querySelectorAll('img').forEach(i=>bindAct(i,w,col,S.result.m.slice().sort((x,y)=>rank(10).indexOf(x)-rank(10).indexOf(y))[0]));
    let tl=0,cl=0,lp=0;w.addEventListener('pointermove',e=>{const r=w.getBoundingClientRect();tl=((e.clientX-r.left)/r.width-.5)*18;const n=performance.now();if((e.buttons||e.pointerType==='touch')&&n-lp>110&&!reduce){lp=n;puff(w,e.clientX-r.left,e.clientY-r.top,Math.random()<.5?col:'#fff6dc')}});w.addEventListener('pointerleave',()=>{tl=0});
    (function loop(){if(!document.body.contains(card))return;const ry=parseFloat(card.style.getPropertyValue('--ry'))||0;cl+=(tl-cl)*.12;ch.style.setProperty('--px',(-ry*.55).toFixed(1)+'px');ch.style.setProperty('--lean',cl.toFixed(2)+'deg');requestAnimationFrame(loop)})();
    if(!reduce)setTimeout(()=>{if(document.body.contains(w)){const r=w.getBoundingClientRect();puff(w,r.width/2,r.height*.55,col);puff(w,r.width*.3,r.height*.7,'#fff6dc');puff(w,r.width*.7,r.height*.7,'#fff6dc')}},1500);
    const rkEl=document.querySelector('.rank');if(rkEl){if('IntersectionObserver' in window){const io2=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io2.disconnect()}}),{threshold:.3});io2.observe(rkEl)}else rkEl.classList.add('in')}
    const pm=[...document.querySelectorAll('.pmas')];
    
    if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.3});pm.forEach(p=>io.observe(p))}else pm.forEach(p=>p.classList.add('in'));
  },0)};
})();
